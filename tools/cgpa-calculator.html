<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGPA Calculator - CGPACalculatorBD</title>
  <meta name="description" content="Calculate semester GPA and CGPA using credits and grade points.">
  <style>
    body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}
    header{background:#173b8f;color:white;padding:20px;text-align:center}
    main{max-width:850px;margin:35px auto;padding:20px}
    .box{background:white;padding:25px;border-radius:12px;box-shadow:0 4px 18px #ddd}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    input{padding:12px;border:1px solid #ccc;border-radius:8px}
    button{padding:12px 18px;background:#173b8f;color:white;border:0;border-radius:8px;cursor:pointer;margin:5px}
    #result{margin-top:20px;padding:15px;background:#eef3ff;font-size:20px;font-weight:bold}
    a{color:white;margin:0 8px}
    @media(max-width:600px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>

<header>
  <h1>CGPA Calculator</h1>
  <a href="../index.html">Home</a>
</header>

<main>
  <div class="box">

    <h2>Calculate CGPA</h2>

    <p>Enter grade point and credit for each course.</p>

    <br>

    <div id="courses">

      <div class="row">
        <input type="number" step="0.01" min="0" max="4" placeholder="Grade Point">
        <input type="number" step="0.5" min="0" placeholder="Credit">
      </div>

      <div class="row">
        <input type="number" step="0.01" min="0" max="4" placeholder="Grade Point">
        <input type="number" step="0.5" min="0" placeholder="Credit">
      </div>

    </div>

    <button onclick="addRow()">+ Add Course</button>
    <button onclick="calculate()">Calculate CGPA</button>

    <div id="result">Your CGPA will appear here.</div>

  </div>
</main>

<script>
function addRow() {
  const container = document.getElementById("courses");

  const row = document.createElement("div");
  row.className = "row";

  row.innerHTML = `
    <input type="number" step="0.01" min="0" max="4" placeholder="Grade Point">
    <input type="number" step="0.5" min="0" placeholder="Credit">
  `;

  container.appendChild(row);
}

function calculate() {
  const rows = document.querySelectorAll(".row");

  let points = 0;
  let credits = 0;

  rows.forEach(row => {
    const inputs = row.querySelectorAll("input");

    const gp = parseFloat(inputs[0].value);
    const credit = parseFloat(inputs[1].value);

    if (!isNaN(gp) && !isNaN(credit) && credit > 0) {
      points += gp * credit;
      credits += credit;
    }
  });

  if (credits === 0) {
    document.getElementById("result").innerText =
      "Please enter valid values.";
    return;
  }

  const cgpa = points / credits;

  document.getElementById("result").innerText =
    "Your CGPA: " + cgpa.toFixed(2);
}
</script>

</body>
</html>
