<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Target CGPA Calculator - CGPACalculatorBD</title>

  <style>
    body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}
    header{background:#173b8f;color:white;padding:20px;text-align:center}
    main{max-width:700px;margin:40px auto;padding:20px}
    .box{background:white;padding:30px;border-radius:12px;box-shadow:0 4px 18px #ddd}
    input{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;margin:8px 0 15px}
    button{padding:13px 20px;background:#173b8f;color:white;border:0;border-radius:8px;cursor:pointer}
    #result{margin-top:20px;padding:20px;background:#eef3ff;font-size:18px}
    a{color:white;margin:0 8px}
  </style>
</head>

<body>

<header>
  <h1>Target CGPA Calculator</h1>
  <a href="../index.html">Home</a>
</header>

<main>

  <div class="box">

    <h2>Calculate Required GPA</h2>

    <label>Current CGPA</label>
    <input id="current" type="number" step="0.01" min="0" max="4" placeholder="Example: 3.50">

    <label>Completed Credits</label>
    <input id="completed" type="number" step="0.5" min="0" placeholder="Example: 90">

    <label>Target CGPA</label>
    <input id="target" type="number" step="0.01" min="0" max="4" placeholder="Example: 3.60">

    <label>Next Credits</label>
    <input id="next" type="number" step="0.5" min="0.5" placeholder="Example: 15">

    <button onclick="calculateTarget()">Calculate Required GPA</button>

    <div id="result">
      Result will appear here.
    </div>

  </div>

</main>

<script>
function calculateTarget() {

  const current = parseFloat(document.getElementById("current").value);
  const completed = parseFloat(document.getElementById("completed").value);
  const target = parseFloat(document.getElementById("target").value);
  const next = parseFloat(document.getElementById("next").value);

  if (
    isNaN(current) ||
    isNaN(completed) ||
    isNaN(target) ||
    isNaN(next) ||
    completed < 0 ||
    next <= 0 ||
    current < 0 ||
    target < 0
  ) {
    document.getElementById("result").innerText =
      "Please enter valid values.";
    return;
  }

  const required =
    (target * (completed + next) - current * completed) / next;

  if (required > 4) {
    document.getElementById("result").innerHTML =
      "Required GPA: <strong>" + required.toFixed(2) +
      "</strong><br><br>This is above 4.00, so it cannot be reached in one semester on a 4.00 scale.";
  } else if (required <= 0) {
    document.getElementById("result").innerHTML =
      "You are already at or above the target under these inputs.";
  } else {
    document.getElementById("result").innerHTML =
      "Required GPA for the next " + next +
      " credits: <strong>" + required.toFixed(2) + "</strong>";
  }
}
</script>

</body>
</html>
