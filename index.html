<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CGPA Calculator BD</title>

  <meta
    name="description"
    content="CGPA Calculator BD - Free academic tools for university students in Bangladesh."

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    /* HEADER */

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e9f1;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 25px 20px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo a {
      color: #20479b;
      text-decoration: none;
      font-size: 34px;
      font-weight: 800;
    }

    .logo span {
      color: #f28a25;
    }

    /* NAVIGATION */

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px 25px;
    }

    nav a {
      color: #4c5870;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
    }

    nav a:hover {
      color: #20479b;
    }

    /* HOME */

    main {
      min-height: 65vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
    }

    .home {
      text-align: center;
    }

    .home h1 {
      color: #20479b;
      font-size: 48px;
      margin-bottom: 15px;
    }

    .home p {
      color: #657087;
      font-size: 19px;
    }

    /* FOOTER */

    footer {
      background: #173f91;
      color: white;
      text-align: center;
      padding: 25px 20px;
    }

    footer p {
      color: #dbe5ff;
      font-size: 14px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .header-inner {
        padding: 22px 14px;
      }

      .logo {
        margin-bottom: 22px;
      }

      .logo a {
        font-size: 28px;
      }

      nav {
        gap: 12px 17px;
      }

      nav a {
        font-size: 14px;
      }

      main {
        padding: 50px 15px;
      }

      .home h1 {
        font-size: 36px;
      }

      .home p {
        font-size: 17px;
      }

    }

  </style>

</head>

<body>


  <!-- HEADER -->

  <header>

    <div class="header-inner">

      <div class="logo">
        <a href="index.html">
          CGPA Calculator <span>BD</span>
        </a>
      </div>


      <nav>

        <a href="index.html">
          Home
        </a>

        <a href="tools/cgpa-calculator.html">

        </a>

        </a>

        <a href="about.html">
          About
        </a>

        <a href="contact.html">
          Contact
        </a>

        <a href="privacy-policy.html">
          Privacy
        </a>

      </nav>

    </div>

  </header>


  <!-- HOME CONTENT -->

  <main>

    <div class="home">

      <h1>
        Welcome to CGPA Calculator BD

      <p>
        Free academic tools for university students in Bangladesh.
      </p>

    </div>

  </main>

  <footer>

    <p>
      © 2026 CGPA Calculator BD. All rights reserved.
